  const free = () => { const sk = SKINS.find(k => !used.has(k.id) && k.id !== 'police' && k.id !== 'gold') || SKINS[cars.length % SKINS.length]; used.add(sk.id); return sk; };
  for (const [k, kind] of [['nBuddy', 'buddy'], ['nPro', 'pro']]) for (let j = 0; j < S[k] && cars.length < MAX; j++) cars.push(new Car(cars.length, new Driver(kind), free()));
  restart(); if (lobby) phase = 'lobby'; }
function restart() { phase = 'count'; tCount = 0; winner = null; excite = 0; for (const c of cars) { c.reset(); if (c.ai) Object.assign(c.ai, { vEst: 0, lane: 0, laneT: 0 }); } for (const g of goos) g.kill(); goos.length = 0; $('banner').innerHTML = ''; lastBeep = -1; }
function finish(c) { winner = c; phase = 'done'; tCount = 0; excite = 6; $('banner').innerHTML = `<span style="color:#${c.col.toString(16).padStart(6, '0')}">${c.name}</span> WINS!<div>new race in a moment · <kbd>R</kbd> restart</div>`;
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.25, 0.18, 'triangle'), i * 140)); }
let lastBeep = -1, paused = false, calibOn = false;
function tick(dt) {
  now += dt; excite = Math.max(0, excite - dt);
  if (phase === 'count') { tCount += dt; const n = Math.floor(tCount / 0.7);
    lamps.forEach((l, i) => { const on = i < n && n <= 5; l.material.color.setHex(on ? 0xff1a1a : 0x220000); l.material.emissive.setHex(on ? 0xff0000 : 0); });
    if (n !== lastBeep && n >= 1 && n <= 5) { beep(440, 0.15, 0.2); lastBeep = n; } $('banner').textContent = n < 5 ? '' : '';
    if (tCount > 0.7 * 6) { phase = 'race'; lamps.forEach(l => { l.material.color.setHex(0x1aff4a); l.material.emissive.setHex(0x00ff30); }); beep(880, 0.5, 0.25); $('banner').textContent = 'GO!'; excite = 2;
      setTimeout(() => { if (phase === 'race') $('banner').textContent = ''; }, 900); for (const c of cars) c.lapStart = now; } }
  if (phase === 'done') { tCount += dt; if (Math.random() < 0.3) burst(rnd(0, AW), rnd(0, AH), ['#ff3b5c', '#ffc21a', '#2fa8ff', '#3ddc6a', '#ffffff'][(Math.random()*5) | 0], 10); if (tCount > 7) showLobby(); }
  cars.forEach(c => c.command(c.ai ? null : readInput(c.i))); cars.forEach(c => c.step(dt));
  for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++) collide(cars[i], cars[j]);
  updateItems(dt);
}
let acc = 0, last = performance.now(), hudT = 0, gT = 0;
function hud() { const rank = [...cars].sort((a, b) => b.dist - a.dist);
  const bar = cars.filter(c => !c.ai).map(p1 => `<div style="margin:2px 0 4px"><span class="dot" style="background:#${p1.col.toString(16).padStart(6, '0')}"></span>${(p1.p('Help') ?? 0) ? 'AJUDA ' + p1.p('Help') + ' · ' : ''}TURBO <span style="display:inline-block;width:90px;height:8px;border-radius:4px;background:#444;vertical-align:middle;overflow:hidden"><i style="display:block;height:100%;width:${Math.round(p1.energy*100)}%;background:${p1.turbo ? '#ff6a00' : '#ffb000'}"></i></span></div>`).join('');
  $('hud').innerHTML = bar + rank.map((c, i) => `<div>${i + 1}. <span class="dot" style="background:#${c.col.toString(16).padStart(6, '0')}"></span>${c.name} · lap ${clamp(c.laps + 1, 1, S.laps)}/${S.laps} <small>${c.best ? 'best ' + c.best.toFixed(1) + 's' : ''}</small></div>`).join('') + `<small>${T.name} · ${T.per.toFixed(1)} m</small>`; }
function draw(dt) {
  for (const c of cars) c.sync(dt); for (const f of anim) f(now, dt);
  for (let i = 0; i < 2; i++) { const h = cars.find(c => c.i === i && !c.ai); engines[i].update(h, !!h && phase === 'race' && !paused); } SMOKE.update(dt); GLOW.update(dt);
  gT += dt; if (groundDirty && gT > 0.15) { groundTex.needsUpdate = true; groundDirty = false; gT = 0; }
  hudT += dt; if (hudT > 0.15) { hud(); hudT = 0; }
  const tilt = S.view === 'tilt'; outer.visible = outerWood.visible = tilt && !BLACK; scene.fog = tilt && !BLACK ? fogTilt : null; scene.background = tilt && !BLACK ? skyTilt : bgTop;
  renderer.render(scene, tilt ? camTilt : camTop);
}
function frame(t) { pollLobby(); const dt = Math.min(0.1, (t - last) / 1000); last = t; if (!paused && !calibOn) { acc += dt; while (acc >= DT) { acc -= DT; tick(DT); } } draw(dt); requestAnimationFrame(frame); }

// ---------------- menu ----------------
let toastT = null;

function helpDots(n) { return [0, 1, 2, 3].map(i => `<span style="display:inline-block;width:16px;height:16px;border-radius:50%;margin:0 3px;vertical-align:middle;background:${i < n ? '#ffd21a' : '#444'}"></span>`).join(''); }
function setHelp(i, n) { n = clamp(n, 0, 4); S['p' + i + 'Help'] = n; save(); toast(`Ajuda ${helpDots(n)} ${HELP[n]}`); beep(n > 2 ? 880 : 520, 0.1, 0.12, 'triangle'); if (lobbyOpen) buildLobby(); }
function hotkey(e) { if (['INPUT', 'SELECT'].includes(e.target.tagName)) return; const k = e.key.toLowerCase(); if (lobbyOpen && k !== 'f' && !['+', '=', '-', '_', 'm', 'p'].includes(k)) { if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault(); return; }
  if (k === 'p' || k === 'm') toggleMenu(); else if (k === 'v') { S.view = S.view === 'top' ? 'tilt' : 'top'; save(); location.reload(); }
  else if (k === 'c') { calibOn = !calibOn; calib.visible = calibOn; document.querySelectorAll('.corner').forEach(c => c.style.display = calibOn ? 'block' : 'none'); }
  else if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else if (k === 'r') restart(); else if (k === '+' || k === '=' || k === '-' || k === '_') setHelp(1, (S.p1Help ?? 0) + (k === '+' || k === '=' ? 1 : -1)); else if (k === 'k') paused = !paused; else if (k === 'l' || k === 'escape') showLobby(); else if (k === 't') { const n = Object.keys(LAYOUTS); S.track = n[(n.indexOf(S.track) + 1) % n.length]; save(); location.reload(); }
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault(); }
function toggleMenu() { const m = $('menu'), open = m.style.display !== 'block'; m.style.display = open ? 'block' : 'none'; $('menuBtn').style.display = open ? 'none' : 'block'; if (open) buildMenu(); }
$('menuBtn').onclick = toggleMenu;
const fullscreen = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
$('fsBtn').onclick = fullscreen;

function buildMenu() {
  const sl = (k, label, mn, mx, st) => `<div class="row"><label>${label}</label><input type="range" data-k="${k}" min="${mn}" max="${mx}" step="${st}"><span class="v" id="v_${k}">${S[k]}</span></div>`;

  let h = `<div class="row"><b style="flex:1;font-size:16px">Robo GP 3D</b><button id="mClose">✕</button></div>
    <h3>Track size</h3><div class="row">${Object.entries(SIZES).map(([k, v]) => `<button data-size="${k}" class="${S.size === k ? 'on' : ''}">${v.name}<small>${v.w} m</small></button>`).join('')}</div>
    <div class="row"><button data-view="tilt" class="${S.view === 'tilt' ? 'on' : ''}">3D inclinado</button><button data-view="top" class="${S.view === 'top' ? 'on' : ''}">De cima (robôs)</button><button id="mFs">⛶ Ecrã inteiro</button></div>
    <h3>Fundo (vista 3D)</h3><div class="row"><button data-bg="black" class="${S.bg === 'black' ? 'on' : ''}">Só pista (resto preto)</button><button data-bg="forest" class="${S.bg !== 'black' ? 'on' : ''}">Floresta</button></div>

    `<h3>Cars <span style="color:#9aa0aa">${carCount()} / ${MAX}</span></h3>` + step('players', 'Humans', 'pad / keys / touch') + step('nBuddy', 'BUDDY', 'plays with the kid') + step('nPro', 'PRO', 'races to win');
  for (const p of ['p1', 'p2'].slice(0, S.players)) h += `<h3>Player ${p[1]}</h3>` + sel(p + 'Mode', 'Driving', [['kid', 'kid: go where I point'], ['adult', 'tank: up = go, sides = turn']]) + sel(p + 'Seat', 'Sits at', [['bottom', 'bottom'], ['top', 'top'], ['left', 'left'], ['right', 'right']]) + sl(p + 'Cap', 'Speed cap (%)', 10, 100, 5) ;

  el.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.view = b.dataset.view; save(); location.reload(); }); $('mRestart').onclick = restart; $('mLobby').onclick = () => { toggleMenu(); showLobby(); }; $('mDef').onclick = () => { S = { ...DEF }; save(); location.reload(); };

// ---------------- landing page: pick cars, driving mode, opponents ----------------
const hex = c => '#' + c.toString(16).padStart(6, '0');
const carSvg = sk => `<svg viewBox="0 0 120 60" width="100%" height="54"><rect x="8" y="14" width="10" height="32" rx="3" fill="#111"/><rect x="18" y="8" width="18" height="10" rx="3" fill="#111"/><rect x="18" y="42" width="18" height="10" rx="3" fill="#111"/><rect x="74" y="9" width="16" height="9" rx="3" fill="#111"/><rect x="74" y="42" width="16" height="9" rx="3" fill="#111"/>
  <path d="M14 20 Q14 12 30 12 L80 14 Q108 18 112 30 Q108 42 80 46 L30 48 Q14 48 14 40 Z" fill="${hex(sk.col)}" stroke="#0006" stroke-width="2"/>
  <rect x="22" y="26" width="84" height="3" fill="${hex(sk.stripe)}"/><rect x="22" y="31" width="84" height="3" fill="${hex(sk.stripe)}"/>
  ${sk.flames ? '<path d="M70 18 q8 4 4 8 q10 -2 8 6 q8 -2 6 6 l-24 -4 z" fill="#ffb000"/>' : ''}${sk.police ? '<rect x="44" y="22" width="8" height="8" fill="#f22"/><rect x="44" y="30" width="8" height="8" fill="#26f"/>' : ''}
  <ellipse cx="50" cy="30" rx="15" ry="9" fill="#0b1220"/><ellipse cx="46" cy="27" rx="7" ry="3" fill="#fff5"/></svg>`;
let lobbyOpen = false, lobbyPad = { x: 0, a: false };
function showLobby() { lobbyOpen = true; makeCars(true); $('lobby').style.display = 'block'; $('banner').innerHTML = ''; buildLobby(); }
function startRace() { lobbyOpen = false; $('lobby').style.display = 'none'; save(); makeCars(); unlock(); }
function buildLobby() {
  const card = i => { const p = 'p' + i, other = S[(i === 1 ? 'p2' : 'p1') + 'Skin'];
    return `<div class="card"><h2>Jogador ${i} <small>${i === 1 ? '· comando' : '· teclado'}</small></h2>
      <div class="skins">${SKINS.map(k => `<button class="skin ${S[p + 'Skin'] === k.id ? 'on' : ''} ${S.players > 1 && other === k.id && S[p + 'Skin'] !== k.id ? 'taken' : ''}" data-skin="${i}:${k.id}">${carSvg(k)}<div>${k.name}</div></button>`).join('')}</div>
      <div class="modes"><button data-mode="${i}:kid" class="${S[p + 'Mode'] === 'kid' ? 'on' : ''}">Fácil<br><small>vai para onde aponto</small></button><button data-mode="${i}:adult" class="${S[p + 'Mode'] !== 'kid' ? 'on' : ''}">Avançado<br><small>frente · trás · esquerda · direita</small></button></div>
      <div class="help"><b>Ajuda</b> ${HELP.map((h, n) => `<button data-help="${i}:${n}" class="${(S[p + 'Help'] ?? 0) === n ? 'on' : ''}">${n === 0 ? '0' : '●'.repeat(n)}<small>${h}</small></button>`).join('')}</div>
      <div class="keys">${i === 1 ? 'Comando: stick para conduzir · <kbd>A</kbd>/<kbd>R2</kbd> gosma · <kbd>B</kbd>/<kbd>L2</kbd> turbo' : 'Setas para conduzir · <kbd>Espaço</kbd> turbo · <kbd>Enter</kbd> gosma'}</div></div>`; };
  $('lobby').innerHTML = `<div class="wrap"><h1>ROBO GP</h1><div class="sub">Escolhe o teu carro!</div>
    <div class="players">${card(1)}${S.players > 1 ? card(2) : ''}</div>
    <div class="row2"><b>Jogadores</b><button data-pl="1" class="${S.players === 1 ? 'on' : ''}">1</button><button data-pl="2" class="${S.players === 2 ? 'on' : ''}">2</button>
      <b style="margin-left:18px">Adversários</b>${[0, 1, 2, 3].map(n => `<button data-ai="${n}" class="${S.nPro + S.nBuddy === n ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="row2"><b>Dificuldade</b>${[['Fáceis', 45], ['Médios', 70], ['Difíceis', 95]].map(([t, v]) => `<button data-skill="${v}" class="${Math.abs(S.aiSkill - v) < 13 ? 'on' : ''}">${t}</button>`).join('')}</div>
    <button class="go" id="goBtn">▶ COMEÇAR</button><div class="hint">Comando: mexe o stick para escolher a cor · <kbd>A</kbd> para começar</div>
    <div class="shortcuts"><b>Atalhos</b> · + / − ajuda do jogador 1 (também a meio da corrida) · K pausa · R recomeçar · L voltar a este ecrã · F ecrã inteiro · T trocar pista · M menu completo (por cima deste ecrã) · C calibrar projetor<br>
      Jogador 1 (comando): stick conduz · A / R2 gosma · B / L2 turbo &nbsp;·&nbsp; Jogador 2 (teclado): setas conduzem · Espaço turbo · Enter gosma</div></div>`;
  const el = $('lobby');
  el.querySelectorAll('[data-skin]').forEach(b => b.onclick = () => { const [i, id] = b.dataset.skin.split(':'); S['p' + i + 'Skin'] = id;
    const o = i === '1' ? 'p2Skin' : 'p1Skin'; if (S.players > 1 && S[o] === id) S[o] = SKINS.find(k => k.id !== id).id; save(); makeCars(true); buildLobby(); });
  el.querySelectorAll('[data-skill]').forEach(b => b.onclick = () => { S.aiSkill = +b.dataset.skill; save(); buildLobby(); });
  el.querySelectorAll('[data-help]').forEach(b => b.onclick = () => { const [i, n] = b.dataset.help.split(':'); setHelp(+i, +n); });
  el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { const [i, m] = b.dataset.mode.split(':'); S['p' + i + 'Mode'] = m; save(); buildLobby(); });
  el.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { S.players = +b.dataset.pl; save(); makeCars(true); buildLobby(); });
  el.querySelectorAll('[data-ai]').forEach(b => b.onclick = () => { S.nPro = +b.dataset.ai; S.nBuddy = 0; save(); makeCars(true); buildLobby(); });
  $('goBtn').onclick = startRace;
}
function pollLobby() {   // the child can pick with the pad: stick left/right changes colour, A starts
  if (!lobbyOpen) return; const gp = [...(navigator.getGamepads ? navigator.getGamepads() : [])].filter(Boolean)[0];
  const kx = keys.has('arrowright') ? 1 : keys.has('arrowleft') ? -1 : 0, x = gp ? (Math.abs(gp.axes[0]) > 0.6 ? Math.sign(gp.axes[0]) : 0) : 0, a = gp && gp.buttons[0] && gp.buttons[0].pressed;
  if (x && x !== lobbyPad.x) { const n = SKINS.findIndex(k => k.id === S.p1Skin); let j = n; do { j = (j + x + SKINS.length) % SKINS.length; } while (S.players > 1 && SKINS[j].id === S.p2Skin);
    S.p1Skin = SKINS[j].id; save(); makeCars(true); buildLobby(); beep(660, 0.06, 0.08, 'triangle'); }
  if (kx && kx !== lobbyPad.kx && S.players > 1) { const n = SKINS.findIndex(k => k.id === S.p2Skin); let j = n; do { j = (j + kx + SKINS.length) % SKINS.length; } while (SKINS[j].id === S.p1Skin);
    S.p2Skin = SKINS[j].id; save(); makeCars(true); buildLobby(); }
  if (a && !lobbyPad.a) startRace();
  if (keys.has('enter') && !lobbyPad.enter) startRace();
  lobbyPad = { x, a, kx, enter: keys.has('enter') };
}
showLobby(); requestAnimationFrame(frame);
window.__race = { S, T, fitTilt, onResize, shot(mode) { fitTilt(mode); draw(0.016); return cv; }, get cars() { return cars; }, get phase() { return phase; }, pads, stars, oils, layouts: () => Object.keys(LAYOUTS).map(n => { const t = buildTrack(n); return [n, +t.per.toFixed(2), +t.minSep.toFixed(3)]; }), sim(sec) { for (let i = 0; i < sec / DT; i++) tick(DT); draw(0.016); } };
</script>
